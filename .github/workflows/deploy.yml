name: "Proxmox Terraform Deploy"

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: self-hosted # <--- Forces the job to run inside your home LXC
    
    env:
      # Map GitHub secrets to environment variables that Terraform recognizes
      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
      TF_VAR_pm_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
      TF_VAR_pm_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
      TF_VAR_container_root_password: ${{ secrets.TF_VAR_container_root_password }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIX: Pointed to a real, valid public GitHub HTTP state endpoint and escaped the variables correctly
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="address=https://api.tfstate.dev/github/v1" \
            -backend-config="lock_address=https://api.tfstate.dev/github/v1/lock" \
            -backend-config="unlock_address=https://api.tfstate.dev/github/v1/lock" \
            -backend-config="username=${{ github.repository }}" \
            -backend-config="password=${{ secrets.GITHUB_TOKEN }}"

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
