name: "Proxmox Terraform Deploy"

on:
  push:
    branches:
      - main

jobs:
  discover:
    name: "Discover Projects"
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_projects: ${{ steps.set-matrix.outputs.has_projects }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Infrastructure Directories
        id: set-matrix
        run: |
          # Scans for project directories containing main.tf under projects/
          # Each project manages ALL its environments (dev, prod, etc.) via for_each in a single apply
          PROJECT_DIRS=$(find projects -maxdepth 2 -name "main.tf" -exec dirname {} \; | sort)
          PROJECT_COUNT=$(echo "$PROJECT_DIRS" | grep -c . || true)

          if [ "$PROJECT_COUNT" -eq 0 ]; then
            echo "⚠️ No projects found under projects/. Skipping terraform deployment."
            echo "has_projects=false" >> $GITHUB_OUTPUT
            echo 'matrix=[{"project_dir":"."}]' >> $GITHUB_OUTPUT
          else
            echo "✅ Found $PROJECT_COUNT project(s). Building deployment matrix."
            echo "has_projects=true" >> $GITHUB_OUTPUT
            JSON_OUTPUT=$(echo "$PROJECT_DIRS" | jq -R -s -c '
              split("\n")
              | map(select(length > 0))
              | map({project_dir: .})
            ')
            echo "matrix=$JSON_OUTPUT" >> $GITHUB_OUTPUT
          fi

  terraform:
    name: "Deploy (${{ matrix.project_dir }})"
    needs: discover
    if: needs.discover.outputs.has_projects == 'true'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    env:
      PROXMOX_VE_ENDPOINT: ${{ secrets.PM_API_URL }}
      PROXMOX_VE_API_TOKEN: "${{ secrets.PM_API_TOKEN_ID }}=${{ secrets.PM_API_TOKEN_SECRET }}"
      TF_VAR_container_root_password: ${{ secrets.TF_VAR_container_root_password }}

      # Single state file per project — for_each handles all environments atomically
      LOCAL_STATE_FILE: "terraform.tfstate"
      PERSISTENT_STATE_DIR: "/home/github/persistent-tf-state/${{ matrix.project_dir }}"
      PERSISTENT_STATE_FILE: "/home/github/persistent-tf-state/${{ matrix.project_dir }}/terraform.tfstate"

    defaults:
      run:
        working-directory: ${{ matrix.project_dir }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Persistent State File
        run: |
          if [ -f "${{ env.PERSISTENT_STATE_FILE }}" ]; then
            cp -f "${{ env.PERSISTENT_STATE_FILE }}" "./${{ env.LOCAL_STATE_FILE }}"
            echo "✅ Restored state: ${{ env.PERSISTENT_STATE_FILE }}"
          else
            echo "ℹ️ No persistent state found. Starting fresh deployment."
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -state="${{ env.LOCAL_STATE_FILE }}"

      - name: Terraform Apply
        run: |
          terraform apply \
            -state="${{ env.LOCAL_STATE_FILE }}" \
            -auto-approve

      - name: Save State Post-Apply
        if: always()
        run: |
          if [ -f "./${{ env.LOCAL_STATE_FILE }}" ]; then
            mkdir -p "${{ env.PERSISTENT_STATE_DIR }}"
            cp -f "./${{ env.LOCAL_STATE_FILE }}" "${{ env.PERSISTENT_STATE_FILE }}"
            echo "💾 Persisted state to ${{ env.PERSISTENT_STATE_FILE }}"
          else
            echo "⚠️ State file ./${{ env.LOCAL_STATE_FILE }} missing. Skip storage."
          fi